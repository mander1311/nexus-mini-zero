<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS MINI ZERO</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">N</div>
          <div>
            <h1>NEXUS</h1>
            <span>MINI ZERO</span>
          </div>
        </div>

        <nav class="sidebar-menu">
          <button class="nav-item active" data-section="dashboard">Dashboard</button>
          <button class="nav-item" data-section="products">Produtos</button>
          <button class="nav-item" data-section="analysis">Análise</button>
          <button class="nav-item" data-section="calculator">Calculadora</button>
          <button class="nav-item" data-section="copywriter">Copywriter</button>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sistema local</p>
            <h2>Gestão de oportunidades</h2>
          </div>
          <button id="refresh-data" class="primary-btn">Atualizar</button>
        </header>

        <section id="dashboard" class="panel active-panel">
          <div class="metric-grid">
            <div class="metric-card">
              <span>Total de produtos</span>
              <strong id="metric-total">0</strong>
            </div>
            <div class="metric-card">
              <span>Oportunidades</span>
              <strong id="metric-opportunities">0</strong>
            </div>
            <div class="metric-card">
              <span>Selecionados</span>
              <strong id="metric-selected">0</strong>
            </div>
            <div class="metric-card accent">
              <span>Comissão potencial</span>
              <strong id="metric-commission">R$ 0,00</strong>
            </div>
          </div>
        </section>

        <section id="products" class="panel">
          <div class="section-header">
            <h3>Gerenciador de produtos</h3>
          </div>

          <form id="product-form" class="product-form">
            <input type="hidden" id="product-id" />
            <div class="field-grid">
              <label>
                Nome
                <input id="product-name" required placeholder="Ex: Mini ventilador portátil" />
              </label>
              <label>
                Marketplace
                <select id="product-marketplace">
                  <option>Amazon</option>
                  <option>AliExpress</option>
                  <option>Mercado Livre</option>
                  <option>Shopee</option>
                  <option>Manual</option>
                </select>
              </label>
              <label>
                Categoria
                <input id="product-category" placeholder="Casa, eletrônica..." />
              </label>
              <label>
                Preço
                <input id="product-price" type="number" min="0" step="0.01" value="0" />
              </label>
              <label>
                Comissão %
                <input id="product-rate" type="number" min="0" max="100" step="0.01" value="0" />
              </label>
              <label>
                Avaliação
                <input id="product-rating" type="number" min="0" max="5" step="0.1" value="0" />
              </label>
              <label>
                Avaliações
                <input id="product-reviews" type="number" min="0" step="1" value="0" />
              </label>
              <label>
                Procura
                <input id="product-demand" type="number" min="0" step="1" value="0" />
              </label>
              <label>
                Concorrência
                <input id="product-competition" type="number" min="0" max="100" step="1" value="0" />
              </label>
              <label class="full-span">
                Link do produto
                <input id="product-link" placeholder="https://..." />
              </label>
              <label class="full-span">
                Link de afiliado
                <input id="product-affiliate" placeholder="https://..." />
              </label>
              <label class="full-span">
                Observações
                <textarea id="product-notes" rows="3" placeholder="Informações relevantes..."></textarea>
              </label>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-btn">Salvar produto</button>
              <button type="button" id="reset-form" class="secondary-btn">Limpar</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Mercado</th>
                  <th>Preço</th>
                  <th>Comissão</th>
                  <th>Score</th>
                  <th>Favorito</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="products-table"></tbody>
            </table>
          </div>
        </section>

        <section id="analysis" class="panel">
          <div class="section-header">
            <h3>Análise de oportunidades</h3>
          </div>
          <div id="analysis-list" class="analysis-list"></div>
        </section>

        <section id="calculator" class="panel">
          <div class="section-header">
            <h3>Calculadora de comissão</h3>
          </div>
          <div class="calculator-grid">
            <label>
              Preço
              <input id="calc-price" type="number" step="0.01" value="149.90" />
            </label>
            <label>
              Comissão %
              <input id="calc-rate" type="number" step="0.01" value="10" />
            </label>
            <label>
              Vendas
              <input id="calc-sales" type="number" step="1" value="10" />
            </label>
            <label>
              Conversão %
              <input id="calc-conversion" type="number" step="0.01" value="5" />
            </label>
          </div>
          <div class="form-actions">
            <button class="primary-btn" id="calculate-btn">Calcular</button>
          </div>
          <div id="calculator-output" class="result-box"></div>
        </section>

        <section id="copywriter" class="panel">
          <div class="section-header">
            <h3>Gerador de conteúdo</h3>
          </div>
          <div class="copywriter-grid">
            <label>
              Nome do produto
              <input id="copy-name" placeholder="Ex: Capa para celular" />
            </label>
            <label>
              Mercado
              <input id="copy-marketplace" value="Amazon" />
            </label>
            <label>
              Preço
              <input id="copy-price" type="number" step="0.01" value="129.90" />
            </label>
            <label>
              Comissão %
              <input id="copy-rate" type="number" step="0.01" value="8" />
            </label>
          </div>
          <div class="form-actions">
            <button class="primary-btn" id="copy-btn">Gerar conteúdo</button>
          </div>
          <div id="copy-output" class="result-box"></div>
        </section>
      </main>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
